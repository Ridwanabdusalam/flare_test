output_root: ./camera_runs
scene_name: sample_scene
serial_baud: 19200
serial_terminator: "\r"
preferred_com_port: COM5
# adb_serial: ABCDEF123456  # Optional: auto-detects when omitted
illumination:
  # LED off, backlight on
  - name: backlights_on_led_off
    serial_command: "p 0 000;p 1 050"
    pwm_percent: 50
    settle_time_s: 1.0
  # Backlight off, LED on (preferred for ROI analysis)
  - name: led_on_backlights_off
    serial_command: "p 0 050;p 1 000"
    pwm_percent: 50
    settle_time_s: 1.0
  # Both illumination sources on
  - name: led_on_backlights_on
    serial_command: "p 0 050;p 1 050"
    pwm_percent: 50
    settle_time_s: 1.0
  # Both illumination sources off
  - name: backlights_off_led_off
    serial_command: "p 0 000;p 1 000"
    pwm_percent: 0
    settle_time_s: 1.0
exposure_sequences:
  - label: visible
    exposure_us: [32000, 64000, 128000, 256000]
    iso: 1600
    frame_count: 1
  - label: ir
    exposure_us: [500, 1000, 2000, 4000, 8000]
    iso: 1600
    frame_count: 1
